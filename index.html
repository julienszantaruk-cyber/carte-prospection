<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultural Places Scout</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Setup Banner -->
<div id="setup-banner" class="hidden">
  <div class="banner-content">
    <strong>⚠️ Supabase non configuré — veuillez remplir CONFIG dans app.js</strong>
  </div>
</div>

<!-- Auth Screen -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-box">
    <h1>🎭 Cultural Places Scout</h1>
    <div id="auth-tabs">
      <button class="tab-btn active" data-tab="login">Connexion</button>
      <button class="tab-btn" data-tab="register">Inscription</button>
    </div>
    <form id="auth-form">
      <div class="form-group">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="votre@email.fr" required>
      </div>
      <div class="form-group">
        <label for="auth-password">Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="auth-name" class="hidden" id="label-name">Nom</label>
        <input type="text" id="auth-name" class="hidden" placeholder="Votre nom">
      </div>
      <button type="submit" class="btn-primary" id="auth-submit">Connexion</button>
      <p id="auth-error" class="error-msg hidden"></p>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="app-screen" class="screen hidden">
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <h2>🎭 Lieux culturels</h2>
      <span class="badge" id="places-count"></span>
    </div>
    <div class="header-right">
      <button class="btn-primary" id="btn-add">+ Ajouter</button>
      <button class="btn-secondary" id="btn-logout">Déconnexion</button>
    </div>
  </header>

  <!-- Filters Bar -->
  <div class="filters-bar">
    <select id="filter-type">
      <option value="">Type : tous</option>
      <option value="gallery">Galerie d'art</option>
      <option value="museum">Musée</option>
      <option value="theater">Théâtre</option>
      <option value="concert">Salle de concert</option>
      <option value="library">Bibliothèque</option>
      <option value="cinema">Cinéma</option>
      <option value="other">Autre</option>
    </select>
    <select id="filter-status">
      <option value="">Statut : tous</option>
      <option value="prospect">Prospect</option>
      <option value="contacted">Contacté</option>
      <option value="contracted">Sous contrat</option>
      <option value="archived">Archivé</option>
    </select>
    <input type="search" id="search-input" placeholder="🔍 Rechercher...">
    <select id="filter-view">
      <option value="list">📋 Liste</option>
      <option value="map">🗺️ Carte</option>
    </select>
  </div>

  <!-- Map View -->
  <div id="view-map" class="view-panel hidden">
    <div id="map"></div>
    <div id="map-toolbar">
      <button class="btn-icon" id="btn-fit-bounds" title="Cadrer sur les lieux">📐 Cadrer</button>
      <button class="btn-icon" id="btn-france" title="Centrer sur la France">🇫🇷 France</button>
      <button class="btn-icon" id="btn-geoloc" title="Ma position">📍 Position</button>
      <button class="btn-icon active" id="btn-pointer" title="Cliquer pour capturer les coordonnées">🎯 Pointer</button>
      <span id="map-mode-label" class="map-mode-label">Mode pointer: actif</span>
    </div>
  </div>

  <!-- List View -->
  <div id="view-list" class="view-panel">
    <div class="list-container">
      <table class="places-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Type</th>
            <th>Ville</th>
            <th>Statut</th>
            <th>⭐</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="places-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="status-msg">Prêt</span>
    <span id="user-email"></span>
  </div>
</div>

<!-- Place Modal -->
<div id="place-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-title">Ajouter un lieu</h3>
      <button class="btn-icon modal-close" id="modal-close" aria-label="Fermer">✕</button>
    </div>
    <form id="place-form">
      <div class="form-row">
        <div class="form-group">
          <label for="place-name">Nom *</label>
          <input type="text" id="place-name" required>
        </div>
        <div class="form-group">
          <label for="place-type">Type *</label>
          <select id="place-type" required>
            <option value="gallery">Galerie d'art</option>
            <option value="museum">Musée</option>
            <option value="theater">Théâtre</option>
            <option value="concert">Salle de concert</option>
            <option value="library">Bibliothèque</option>
            <option value="cinema">Cinéma</option>
            <option value="other">Autre</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="place-description">Description</label>
        <textarea id="place-description" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="place-address">Adresse</label>
        <input type="text" id="place-address">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-city">Ville *</label>
          <input type="text" id="place-city" required>
        </div>
        <div class="form-group">
          <label for="place-postal">Code postal</label>
          <input type="text" id="place-postal">
        </div>
        <div class="form-group">
          <label for="place-country">Pays</label>
          <input type="text" id="place-country" value="France">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-lat">Latitude</label>
          <input type="number" id="place-lat" step="any" readonly>
        </div>
        <div class="form-group">
          <label for="place-lng">Longitude</label>
          <input type="number" id="place-lng" step="any" readonly>
        </div>
        <div class="form-group">
          <button type="button" class="btn-secondary geo-btn" id="btn-clear-geo">Effacer</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-email">Email</label>
          <input type="email" id="place-email">
        </div>
        <div class="form-group">
          <label for="place-phone">Téléphone</label>
          <input type="tel" id="place-phone">
        </div>
        <div class="form-group">
          <label for="place-website">Site web</label>
          <input type="url" id="place-website">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-status">Statut</label>
          <select id="place-status">
            <option value="prospect">Prospect</option>
            <option value="contacted">Contacté</option>
            <option value="contracted">Sous contrat</option>
            <option value="archived">Archivé</option>
          </select>
        </div>
        <div class="form-group">
          <label for="place-priority">Priorité</label>
          <select id="place-priority">
            <option value="low">Basse</option>
            <option value="medium">Moyenne</option>
            <option value="high">Haute</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-surface">Surface (m²)</label>
          <input type="number" id="place-surface" min="0">
        </div>
        <div class="form-group">
          <label for="place-rent">Loyer mensuel (€)</label>
          <input type="number" id="place-rent" min="0">
        </div>
        <div class="form-group check-group">
          <label for="place-favorite">⭐ Favori</label>
          <input type="checkbox" id="place-favorite">
        </div>
      </div>

      <div class="form-group">
        <label for="place-notes">Notes</label>
        <textarea id="place-notes" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="place-tags">Tags (séparés par virgule)</label>
          <input type="text" id="place-tags">
        </div>
        <div class="form-group">
          <label for="place-next-date">Prochaine action</label>
          <input type="date" id="place-next-date">
        </div>
      </div>

      <div class="modal-footer">
        <div class="footer-left">
          <button type="button" class="btn-danger hidden" id="btn-delete">Supprimer</button>
        </div>
        <div class="footer-right">
          <button type="button" class="btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn-primary" id="btn-save">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Coordinate tooltip -->
<div id="coord-tooltip" class="coord-tooltip hidden"></div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5"}' crossorigin="anonymous"></script>
</body>
</html>
